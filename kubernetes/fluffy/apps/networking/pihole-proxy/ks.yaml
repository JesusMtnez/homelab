---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole-proxy
  namespace: flux-system
spec:
  interval: 5m
  path: ./kubernetes/fluffy/apps/networking/pihole-proxy
  prune: true
  dependsOn:
    - name: gateway
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system