---
# Flux Kustomization for the shared Gateway API Gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 5m
  path: ./kubernetes/fluffy/apps/networking/gateway
  prune: true
  dependsOn:
    - name: cilium-lb
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
