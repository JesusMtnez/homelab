---
# Flux Kustomization for Cilium (CNI + Gateway API + kube-proxy replacement).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 5m
  path: ./kubernetes/fluffy/apps/kube-system/cilium
  prune: true
  dependsOn:
    - name: apps-kube-system
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system