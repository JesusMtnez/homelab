---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: vikunja
        namespace: default
  valuesFrom:
    - kind: ConfigMap
      name: vikunja-values
      valuesKey: values.yaml
