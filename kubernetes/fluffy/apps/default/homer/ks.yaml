---
# Flux Kustomization for Homer.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homer
  namespace: flux-system
spec:
  interval: 5m
  path: ./kubernetes/fluffy/apps/default/homer
  prune: true
  dependsOn:
    - name: apps-default
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
