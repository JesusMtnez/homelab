---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homer
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: default
  valuesFrom:
    - kind: ConfigMap
      name: homer-values
      valuesKey: values.yaml
  upgrade:
    force: true
