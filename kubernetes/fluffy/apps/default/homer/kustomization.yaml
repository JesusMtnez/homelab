---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: homer-config
    namespace: default
    files:
      - config.yml
  - name: homer-css
    namespace: default
    files:
      - assets/css/catppuccin-latte.css
      - assets/css/catppuccin-frappe.css
  - name: homer-values
    namespace: default
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
