---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookstack
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bookstack
        namespace: default
  valuesFrom:
    - kind: ConfigMap
      name: bookstack-values
      valuesKey: values.yaml
