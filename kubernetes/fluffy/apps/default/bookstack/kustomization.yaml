---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - secret.sops.yaml
configMapGenerator:
  - name: bookstack-values
    namespace: default
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: PersistentVolumeClaim
      name: bookstack-data
    patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: bookstack-data
        annotations:
          nfs.io/storage-path: "bookstack"
