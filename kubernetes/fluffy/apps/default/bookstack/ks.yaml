---
# Flux Kustomization for BookStack.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookstack
  namespace: flux-system
spec:
  interval: 5m
  path: ./kubernetes/fluffy/apps/default/bookstack
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: apps-default
      namespace: flux-system
    - name: gateway
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
