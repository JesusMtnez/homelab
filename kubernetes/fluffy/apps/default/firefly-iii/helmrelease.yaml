---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-iii
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: firefly-iii
      version: "1.10.1"
      sourceRef:
        kind: HelmRepository
        name: firefly-iii
        namespace: default
  valuesFrom:
    - kind: ConfigMap
      name: firefly-iii-values
      valuesKey: values.yml
