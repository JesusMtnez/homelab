---
# FluxInstance drives the Flux Operator.
# The operator reconciles this CR to install/upgrade the Flux controllers,
# and (spec.sync) generates the GitRepository + Kustomization that apply the
# rest of kubernetes/fluffy/. Managed by Flux itself once bootstrapped.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: 2.9.5
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: false
  kustomize:
    patches:
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --sops-age-secret=sops-age
        target:
          kind: Deployment
          name: kustomize-controller
      - patch: |
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: sops-age
        target:
          kind: Kustomization
  sync:
    kind: GitRepository
    url: https://codeberg.org/JesusMtnez/homelab
    ref: refs/heads/main
    path: kubernetes/fluffy
    interval: 1m
