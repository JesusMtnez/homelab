---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gateway-api-crds
      version: "1.2.1"
      sourceRef:
        kind: HelmRepository
        name: christianhuth
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    standard:
      enabled: true
    experimental:
      enabled: false
    global:
      resourcePolicy:
        keep: true
