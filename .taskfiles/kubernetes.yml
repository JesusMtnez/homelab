---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  cluster: fluffy
  ns: '{{.ns | default "default"}}'
  app: "{{ .app }}"

env:
  KUBECONFIG: "{{.ROOT_DIR}}/kubeconfig"

tasks:
  bootstrap:
    desc: Bootstrap a fresh cluster (one-time)
    summary: |
      One-time bring-up of a new cluster: install Cilium (CNI) and the Flux
      Operator via Helm, apply the FluxInstance, then wait for the Flux
      controllers. Versions/values are sourced from the git manifests, so
      upgrades afterwards are handled by Flux from git.
    vars:
      CILIUM_VERSION:
        sh: yq -r '.spec.chart.spec.version' {{.KUBERNETES_DIR}}/{{.cluster}}/apps/kube-system/cilium/helmrelease.yaml
      FLUX_OPERATOR_VERSION:
        sh: yq -r '.spec.chart.spec.version' {{.KUBERNETES_DIR}}/{{.cluster}}/infra/flux-operator/helmrelease.yaml
    preconditions:
      - {msg: "Missing age.key - run 'task age' first", sh: "test -f {{.SOPS_AGE_KEY_FILE}}"}
    cmds:
      - helm upgrade --install cilium cilium --repo https://helm.cilium.io/ --namespace kube-system --create-namespace --version {{.CILIUM_VERSION}} --values {{.KUBERNETES_DIR}}/{{.cluster}}/apps/kube-system/cilium/values.yaml --wait
      - kubectl -n kube-system rollout status daemonset/cilium --timeout=10m
      - helm upgrade --install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator --namespace flux-system --create-namespace --version {{.FLUX_OPERATOR_VERSION}} --wait
      - kubectl -n flux-system rollout status deployment/flux-operator --timeout=10m
      - kubectl -n flux-system create secret generic sops-age --from-file=age.agekey={{.SOPS_AGE_KEY_FILE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f {{.KUBERNETES_DIR}}/{{.cluster}}/infra/flux-operator/fluxinstance.yaml
      - kubectl -n flux-system rollout status deployment/kustomize-controller --timeout=10m

  preview:
    desc: Preview
    requires:
      vars: ["app"]
    summary: |
      Args
        namespace: namespace of the application (default: default)
        app: application to preview
    cmds:
      - kubectl kustomize --enable-helm {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}}
      - defer: {task: cleanup}
    preconditions:
      - {msg: "Missing namespace", sh: "test -d {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}"}
      - {msg: "Missing application", sh: "test -d {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}}"}

  apply:
    desc: Apply
    requires:
      vars: ["app"]
    summary: |
      Args
        namespace: namespace of the application (default: default)
        app: application
    cmds:
      - task: create-secret
      - kubectl kustomize --enable-helm {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}} | kubectl apply -f -
      - defer: {task: cleanup}
    preconditions:
      - {msg: "Missing namespace", sh: "test -d {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}"}
      - {msg: "Missing application", sh: "test -d {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}}"}

  delete:
    desc: Delete
    requires:
      vars: ["app"]
    summary: |
      Args
        namespace: namespace of the application (default: default)
        app: application
    cmds:
      - task: delete-secret
      - kubectl kustomize --enable-helm {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}} | kubectl delete -f -
      - defer: {task: cleanup}
    preconditions:
      - {msg: "Missing namespace", sh: "test -d {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}"}
      - {msg: "Missing application", sh: "test -d {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}}"}

  get:
    desc: Get resource from namespace
    summary: |
      Args:
        ns: namespace of the application (default: default)
        rs: resource to retrieve (default: pods)
    vars:
      rs: '{{.resource | default "pods"}}'
    cmd: kubectl get --namespace={{.ns}} {{.rs}}

  getAll:
    desc: List all in all namespaces
    cmds:
      - "kubectl get all --all-namespaces"

  create-secret:
    internal: true
    cmd: |
      [ -f {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}}/secret.sops.yml ] &&
        sops --decrypt {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}}/secret.sops.yml | kubectl apply -f - ||
        echo "No secret to apply for {{.ns}}/{{.app}}"

  delete-secret:
    internal: true
    cmd: |
      [ -f {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}}/secret.sops.yml ] &&
        sops --decrypt {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}}/secret.sops.yml | kubectl delete -f - ||
        echo "No secret to delete for {{.ns}}/{{.app}}"

  cleanup:
    internal: true
    silent: true
    cmds:
      - rm -rf {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.ns}}/{{.app}}/charts
